ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
  }
  application {
    modules = [ com.apofeoz.backend.ApplicationKt.module ]
  }
}

app {
  jdbcUrl = "jdbc:postgresql://localhost:15432/apofeoz"
  dbUser = "apofeoz"
  dbPassword = "apofeoz"
  jwtSecret = "dev-secret-change-in-production-min-32-chars!!"
  jwtIssuer = "apofeoz"
  jwtAudience = "apofeoz-mobile"
  accessTokenMinutes = 15
  refreshTokenDays = 30
  # Календарные дни и часы в отчётах — по московскому времени (переопределите при необходимости).
  reportTimeZone = "Europe/Moscow"
  seedAdminEmail = ""
  seedAdminPassword = ""
  seedAdminPhone = ""
}
