<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminUserManagement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #0d0d0d;
        --foreground: #f8fafc;
        --primary: #d4af37;
        --primary-foreground: #0d0d0d;
        --secondary: #27272a;
        --secondary-foreground: #e4e4e7;
        --muted: #27272a;
        --muted-foreground: #a1a1aa;
        --accent: #27272a;
        --accent-foreground: #f8fafc;
        --destructive: #dc2626;
        --card: #171717;
        --card-foreground: #f8fafc;
        --popover: #171717;
        --popover-foreground: #f8fafc;
        --border: #27272a;
        --input: #171717;
        --ring: #d4af37;
        --chart-1: #d4af37;
        --chart-2: #a1a1aa;
        --chart-3: #ef4444;
        --chart-4: #3f3f46;
        --chart-5: #f8fafc;

        --font-sans: "Inter";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.5rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-24">
      <header class="bg-card border-b border-border px-6 pt-10 pb-6 sticky top-0 z-20">
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-2">
            <iconify-icon icon="solar:buildings-bold" class="text-primary text-2xl"></iconify-icon
            ><span class="font-heading font-bold uppercase tracking-widest text-lg">Апофеоз</span>
          </div>
          <button
            class="bg-primary w-10 h-10 rounded-full flex items-center justify-center text-primary-foreground shadow-lg active:scale-90 transition-transform"
          >
            <iconify-icon icon="hugeicons:add-01" class="text-2xl"></iconify-icon>
          </button>
        </div>
        <h2 class="font-heading text-2xl font-bold uppercase tracking-wider mb-4">
          Управление штатом
        </h2>
        <div class="flex bg-muted rounded-lg p-1">
          <button
            class="flex-1 bg-card text-foreground font-bold text-[10px] uppercase tracking-widest py-2 rounded-md shadow-sm"
          >
            Бригадиры</button
          ><button
            class="flex-1 text-muted-foreground font-bold text-[10px] uppercase tracking-widest py-2"
          >
            Работники
          </button>
        </div>
      </header>
      <main class="p-6 space-y-6">
        <div class="flex gap-2">
          <div class="relative flex-1 group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <iconify-icon
                icon="solar:magnifer-linear"
                class="text-muted-foreground text-sm group-focus-within:text-primary"
              ></iconify-icon>
            </div>
            <input
              type="text"
              class="w-full bg-card border border-border text-foreground rounded-lg pl-9 pr-4 py-2.5 text-xs focus:border-primary focus:ring-0 outline-none transition-all placeholder:text-muted-foreground/40 font-medium uppercase tracking-wide"
              placeholder="Поиск по имени..."
            />
          </div>
          <button
            class="bg-card border border-border px-3 py-2.5 rounded-lg text-muted-foreground hover:text-primary transition-colors"
          >
            <iconify-icon icon="solar:filter-linear" class="text-lg"></iconify-icon>
          </button>
        </div>
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-[11px] font-black text-muted-foreground uppercase tracking-[0.2em]">
              Активные бригадиры (4)
            </h3>
          </div>
          <div class="space-y-3">
            <div class="bg-card border border-border rounded-lg p-4 group">
              <div class="flex items-start justify-between mb-4">
                <div class="flex gap-4">
                  <img
                    src="https://randomuser.me/api/portraits/men/12.jpg"
                    class="w-12 h-12 rounded-lg object-cover"
                    alt="Avatar"
                  />
                  <div>
                    <h4 class="text-sm font-bold uppercase tracking-wide">Зотов Михаил</h4>
                    <div class="flex items-center gap-2 mt-1">
                      <span
                        class="bg-primary/10 text-primary text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-widest"
                        >Бригадир</span
                      ><span
                        class="text-muted-foreground text-[9px] font-bold uppercase tracking-widest"
                        >ID: 0294</span
                      >
                    </div>
                  </div>
                </div>
                <button class="text-muted-foreground hover:text-primary p-1">
                  <iconify-icon icon="solar:menu-dots-bold" class="text-xl"></iconify-icon>
                </button>
              </div>
              <div class="grid grid-cols-2 gap-3 pt-4 border-t border-border/50">
                <div class="bg-muted/30 p-2 rounded-md">
                  <p
                    class="text-[8px] font-bold text-muted-foreground uppercase tracking-widest mb-1"
                  >
                    Работников
                  </p>
                  <p class="text-sm font-heading font-bold">18 человек</p>
                </div>
                <div class="bg-muted/30 p-2 rounded-md">
                  <p
                    class="text-[8px] font-bold text-muted-foreground uppercase tracking-widest mb-1"
                  >
                    Статус
                  </p>
                  <div class="flex items-center gap-1.5">
                    <span class="h-1.5 w-1.5 bg-green-500 rounded-full"></span>
                    <p class="text-sm font-heading font-bold">На связи</p>
                  </div>
                </div>
              </div>
              <div class="mt-4 flex gap-2">
                <button
                  class="flex-1 bg-secondary text-secondary-foreground text-[9px] font-bold uppercase tracking-widest py-2 rounded-full border border-border hover:border-primary transition-all flex items-center justify-center gap-2"
                >
                  <iconify-icon icon="solar:transfer-horizontal-linear"></iconify-icon
                  >Перевод</button
                ><button
                  class="bg-destructive/10 text-destructive text-[9px] font-bold uppercase tracking-widest py-2 px-4 rounded-full border border-destructive/20 hover:bg-destructive hover:text-destructive-foreground transition-all"
                >
                  Уволить
                </button>
              </div>
            </div>
            <div class="bg-card border border-border rounded-lg p-4 group opacity-90">
              <div class="flex items-start justify-between mb-4">
                <div class="flex gap-4">
                  <img
                    src="https://randomuser.me/api/portraits/women/24.jpg"
                    class="w-12 h-12 rounded-lg object-cover"
                    alt="Avatar"
                  />
                  <div>
                    <h4 class="text-sm font-bold uppercase tracking-wide">Павлова Анна</h4>
                    <div class="flex items-center gap-2 mt-1">
                      <span
                        class="bg-primary/10 text-primary text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-widest"
                        >Бригадир</span
                      ><span
                        class="text-muted-foreground text-[9px] font-bold uppercase tracking-widest"
                        >ID: 0182</span
                      >
                    </div>
                  </div>
                </div>
                <button class="text-muted-foreground hover:text-primary p-1">
                  <iconify-icon icon="solar:menu-dots-bold" class="text-xl"></iconify-icon>
                </button>
              </div>
              <div class="grid grid-cols-2 gap-3 pt-4 border-t border-border/50">
                <div class="bg-muted/30 p-2 rounded-md">
                  <p
                    class="text-[8px] font-bold text-muted-foreground uppercase tracking-widest mb-1"
                  >
                    Работников
                  </p>
                  <p class="text-sm font-heading font-bold">12 человек</p>
                </div>
                <div class="bg-muted/30 p-2 rounded-md">
                  <p
                    class="text-[8px] font-bold text-muted-foreground uppercase tracking-widest mb-1"
                  >
                    Статус
                  </p>
                  <div class="flex items-center gap-1.5">
                    <span class="h-1.5 w-1.5 bg-muted-foreground rounded-full"></span>
                    <p class="text-sm font-heading font-bold">Оффлайн</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <nav
        class="fixed bottom-0 left-0 right-0 bg-card/95 backdrop-blur-md border-t border-border flex justify-around items-center px-4 py-3 z-30"
      >
        <button class="flex flex-col items-center gap-1 flex-1 text-primary">
          <iconify-icon icon="solar:users-group-two-rounded-bold" class="text-2xl"></iconify-icon
          ><span class="text-[10px] font-bold uppercase tracking-widest">Персонал</span></button
        ><button class="flex flex-col items-center gap-1 flex-1 text-muted-foreground/60">
          <iconify-icon icon="solar:chart-2-linear" class="text-2xl"></iconify-icon
          ><span class="text-[10px] font-bold uppercase tracking-widest">Отчеты</span></button
        ><button class="flex flex-col items-center gap-1 flex-1 text-muted-foreground/60">
          <iconify-icon icon="solar:settings-linear" class="text-2xl"></iconify-icon
          ><span class="text-[10px] font-bold uppercase tracking-widest">Система</span>
        </button>
      </nav>
    </div>
  </body>
</html>
